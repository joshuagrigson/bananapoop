<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Fling portal</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 600 11px/1.2 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #e9e9f2; }
  .pill {
    position: absolute; top: 14px; bottom: 14px; right: 0; width: 52px;
    border-radius: 26px 0 0 26px;
    background: rgba(14, 14, 22, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12); border-right: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; transition: width 180ms ease, box-shadow 220ms ease, background 180ms;
    box-shadow: -6px 0 22px rgba(0, 0, 0, 0.35);
  }
  .pill:hover, .pill.over { width: 66px; }
  .pill.linked { box-shadow: -6px 0 22px rgba(0, 0, 0, 0.35), 0 0 18px rgba(34, 211, 238, 0.35); }
  .pill.over { background: rgba(139, 92, 246, 0.92); box-shadow: 0 0 40px rgba(139, 92, 246, 0.8); }
  .phone { width: 20px; height: 34px; border: 2px solid currentColor; border-radius: 6px; position: relative; opacity: 0.9; }
  .phone::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 2px; margin-left: -3px; border-radius: 2px; background: currentColor; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5b5b6e; }
  .linked .dot { background: #22d3ee; box-shadow: 0 0 10px #22d3ee; animation: pulse 2.4s ease-in-out infinite; }
  .label { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  @keyframes pulse { 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div class="pill" id="pill" title="Drop files here to fling them to your phone. Click to pair.">
  <div class="phone"></div>
  <div class="dot"></div>
  <div class="label" id="label">Fling</div>
</div>
<script src="portal.js"></script>
</body>
</html>
