name: Mirror the Brain

on:
  schedule:
    # 10:00 UTC = 5:00 AM CDT / 4:00 AM CST. After the 2:30 AM census and the
    # 3:09 AM sleep cycle, so each night's MAP and digest land in the same commit.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-export every doc, ignoring the manifest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brain-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive client
        run: pip install --quiet google-api-python-client google-auth

      - name: Pull the Brain
        id: pull
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          MIRROR_FULL: ${{ inputs.full && '1' || '0' }}
        run: python scripts/mirror.py

      - name: Commit if anything changed
        run: |
          git config user.name "brain-mirror"
          git config user.email "brain-mirror@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed tonight."
            exit 0
          fi
          git commit -m "Mirror $(date -u +%Y-%m-%d): ${{ steps.pull.outputs.changed }} changed of ${{ steps.pull.outputs.docs }} docs (${{ steps.pull.outputs.errors }} fetch errors)"
          git push
