<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Terminal</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Cinzel:wght@700&family=Fredoka:wght@600&family=Nunito:wght@600;700&family=Orbitron:wght@700&family=Share+Tech+Mono&family=Audiowide&family=Exo+2:wght@500;600&family=Righteous&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020904; --panel: rgba(3, 19, 10, .9); --line: #0f4a24; --ph: #39ff88; --ph2: #1fbf5f; --dim: #138a44; --warn: #ffd34d; --bad: #ff5c5c; --hi: #b9ffd6;
    --glowc: rgba(57, 255, 136, .55); --done: rgba(57, 255, 136, .07); --st-a: #062a14; --st-b: #041d0e;
    --f-term: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --f-head: var(--f-term); --fs: 15px; --world: .32;
  }
  /* each station world gets its own screen: the castle's scrying glass, the farm's chalkboard, the ocean's sonar */
  :root[data-skin="castle"] { --bg: #0b0706; --panel: rgba(22, 13, 9, .9); --line: #5a3a18; --ph: #ffc45a; --ph2: #d9962a; --dim: #9a6a2a; --hi: #ffe6b0; --glowc: rgba(255, 180, 70, .5); --done: rgba(255, 196, 90, .07); --st-a: #2a1a0c; --st-b: #1c1108; --f-head: "Cinzel", Georgia, serif; }
  :root[data-skin="farm"] { --bg: #1e2a22; --panel: rgba(34, 48, 38, .93); --line: #7a5a36; --ph: #f4f1e6; --ph2: #d8d2bf; --dim: #a8b4a4; --hi: #ffffff; --warn: #ffd96a; --glowc: rgba(255, 255, 255, 0); --done: rgba(255, 255, 255, .05); --st-a: #2c3c30; --st-b: #253329; --f-term: "Nunito", "Segoe UI", sans-serif; --f-head: "Fredoka", "Nunito", sans-serif; --fs: 13px; --world: .55; }
  :root[data-skin="cyber"] { --bg: #07040f; --panel: rgba(16, 6, 30, .9); --line: #3a1f66; --ph: #00f0ff; --ph2: #ff2bd6; --dim: #8a6ac0; --hi: #ffffff; --warn: #ffe066; --glowc: rgba(0, 240, 255, .55); --done: rgba(255, 43, 214, .08); --st-a: #1c0a36; --st-b: #120624; --f-term: "Share Tech Mono", ui-monospace, monospace; --f-head: "Orbitron", sans-serif; --fs: 13px; }
  :root[data-skin="alien"] { --bg: #020805; --panel: rgba(6, 24, 20, .9); --line: #1f5446; --ph: #b8ff6a; --ph2: #5affc8; --dim: #4f9a7a; --hi: #eaffd0; --glowc: rgba(184, 255, 106, .5); --done: rgba(90, 255, 200, .07); --st-a: #0b2a22; --st-b: #071c17; --f-term: "Exo 2", sans-serif; --f-head: "Audiowide", sans-serif; --fs: 13px; }
  :root[data-skin="ocean"] { --bg: #020d16; --panel: rgba(4, 26, 44, .9); --line: #1b4d72; --ph: #4ee6ff; --ph2: #2fb8d8; --dim: #4f8fae; --hi: #d8f8ff; --warn: #ffd166; --glowc: rgba(78, 230, 255, .5); --done: rgba(78, 230, 255, .07); --st-a: #06243c; --st-b: #041a2c; --f-term: "JetBrains Mono", ui-monospace, monospace; --f-head: "Righteous", sans-serif; --fs: 12.5px; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: transparent; color: var(--ph); font: var(--fs)/1.35 var(--f-term); }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: var(--world); }
  :root[data-skin="farm"] body::after { display: none; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(0,0,0,.85); z-index: 2; }
  .glow { text-shadow: 0 0 6px var(--glowc); }
  .demo { background: #3a0f14; color: #ffb3b8; padding: 5px 14px; font-size: 12px; display: none; }
  .ticker { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; background: var(--panel); }
  .ticker div { padding: 6px 14px; border-right: 1px solid var(--line); font-size: 12px; }
  .ticker b { color: var(--hi); }
  .ticker a { color: var(--ph); }
  main { padding: 14px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  @media (max-width: 420px) { main { grid-template-columns: 1fr; padding: 10px; } }
  .term { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 0 18px var(--done) inset; min-width: 0; }
  :root[data-skin="farm"] .term { border: 3px solid var(--line); border-radius: 6px; }
  :root[data-skin="cyber"] .term { border-left: 2px solid var(--ph2); }
  :root[data-skin="alien"] .term, :root[data-skin="ocean"] .term { border-radius: 14px; overflow: hidden; }
  .term.killed { opacity: .55; filter: hue-rotate(-100deg); }
  .term header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .term header h2 { margin: 0; font: 700 15px/1.2 var(--f-head); letter-spacing: .08em; text-transform: uppercase; }
  .tag { font-size: 10px; border: 1px solid currentColor; padding: 0 5px; }
  .tag.gated { color: var(--warn); } .tag.killed { color: var(--bad); } .tag.live { color: var(--ph); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .kpis div { padding: 6px 10px; border-right: 1px solid var(--line); }
  .kpis div:last-child { border-right: 0; }
  .kpis .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
  .kpis .v { font-size: 20px; }
  .body { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 420px) { .body { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } }
  .pipe { border-right: 1px solid var(--line); padding: 8px 10px; }
  .step { border: 1px solid var(--line); padding: 4px 6px; margin-bottom: 5px; font-size: 12px; }
  .step .n { color: var(--dim); font-size: 10px; }
  .step.done { border-color: var(--ph2); background: var(--done); }
  .step.next { border-color: var(--ph); animation: pulse 1.6s ease-in-out infinite; }
  .step.gated { border-color: var(--warn); color: var(--warn); }
  @keyframes pulse { 50% { box-shadow: 0 0 10px var(--glowc); } }
  .bar { height: 3px; background: var(--line); margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--ph); }
  .out { padding: 8px 10px; }
  .out h3, .pipe h3 { margin: 0 0 6px; font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: normal; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .card { border: 1px solid var(--line); padding: 5px; font-size: 11px; min-height: 58px; overflow: hidden; }
  .card .thumb { height: 26px; margin-bottom: 4px; background: repeating-linear-gradient(45deg, var(--st-a) 0 4px, var(--st-b) 4px 8px); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dim); }
  .card.earned { border-color: var(--warn); }
  .card.earned .thumb { color: var(--warn); }
  .card a { color: var(--ph); text-decoration: none; }
  .log { border-top: 1px solid var(--line); padding: 6px 10px; font-size: 11px; color: var(--ph2); max-height: 76px; overflow: hidden; }
  .empty { color: var(--dim); font-size: 11px; }
  .crew { color: var(--hi); }
  .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div class="demo" id="demo">DEMO LEDGER: fictional preview data.</div>
<div class="ticker glow" id="ticker"></div>
<main id="grid"></main>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  let outbox = [];
  const DAY = 864e5, within = (e, days) => Date.now() - Date.parse(e.ts) < days * DAY;
  const count = (lines) => lines.reduce((a, e) => a + (e.qty || 1), 0);
  // ---- the world behind the numbers: the station's skin, painted once as a smooth backdrop (scenery only, no data)
  const WORLDS = [['space', 'Space station', '#7aa2ff', 'Space'], ['castle', 'Dark castle', '#e9b949', 'Castle'], ['farm', 'Farm', '#8ad65f', 'Farm'], ['cyber', 'Cyber city', '#ff2bd6', 'Cyber'], ['alien', 'Alien ship', '#5affc8', 'Alien'], ['ocean', 'Ocean base', '#4ee6ff', 'Ocean']];
  const WORLD_IDS = WORLDS.map((w) => w[0]);
  function paintWorld(cv, skin) {
    // the station's world behind the numbers, drawn smooth at the screen's full resolution (scenery only, no data)
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    let seed = 1234567;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const grad = (stops) => { const l = g.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => l.addColorStop(o, c)); g.fillStyle = l; g.fillRect(0, 0, w, h); };
    const glow = (x, y, r, c, a = 1) => { const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, c); q.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = q; g.fillRect(x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; };
    const stars = (n, maxY, a = 1) => { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(235,240,255,${(0.25 + rnd() * 0.75) * a})`; g.beginPath(); g.arc(rnd() * w, rnd() * maxY, 0.5 + rnd() * 1.3, 0, 7); g.fill(); } };
    const hills = (base, amp, col, s1) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w + 20; x += 20) g.lineTo(x, h * base - (Math.sin(x * 0.004 + s1) * 0.5 + Math.sin(x * 0.011 + s1 * 2) * 0.3) * amp); g.lineTo(w, h); g.closePath(); g.fill(); };
    const disc = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
    if (skin === 'farm') {
      grad([[0, '#6fbef5'], [1, '#e2f4ff']]);
      glow(w * 0.82, h * 0.14, 140, 'rgba(255,246,200,0.8)'); disc(w * 0.82, h * 0.14, 30, '#fff3b0');
      for (let i = 0; i < 6; i++) { const cx = rnd() * w, cy = h * (0.08 + rnd() * 0.22); g.fillStyle = 'rgba(255,255,255,0.9)'; for (const [dx, dy, r] of [[0, 0, 28], [26, -8, 22], [-26, -4, 20], [48, 4, 17]]) disc(cx + dx, cy + dy, r, 'rgba(255,255,255,0.9)'); }
      hills(0.62, 50, '#9fd18a', 1); hills(0.74, 40, '#79bb5e', 3); hills(0.86, 30, '#5fa84a', 5);
      for (let i = 0; i < 10; i++) { const x = rnd() * w, y = h * (0.7 + rnd() * 0.12); g.fillStyle = '#7a4e2a'; g.fillRect(x - 3, y - 12, 6, 14); disc(x, y - 22, 16, i % 2 ? '#3f9e52' : '#4bb562'); }
    } else if (skin === 'castle') {
      grad([[0, '#1d1633'], [0.6, '#2a1f40'], [1, '#07050d']]);
      stars(160, h * 0.6, 0.8);
      glow(w * 0.8, h * 0.16, 170, 'rgba(216,200,255,0.45)'); disc(w * 0.8, h * 0.16, 34, '#f4f0d8');
      for (const [dx, dy, r] of [[-9, -7, 6], [8, 5, 5], [-3, 12, 4]]) disc(w * 0.8 + dx, h * 0.16 + dy, r, 'rgba(180,170,150,0.35)');
      hills(0.62, 80, '#241a33', 2);
      g.fillStyle = '#1a1326'; for (const [fx, fw, fh] of [[0.1, 30, 140], [0.15, 20, 100], [0.86, 34, 160], [0.92, 22, 110]]) { const x = w * fx; g.fillRect(x, h * 0.64 - fh, fw, fh + 20); g.beginPath(); g.moveTo(x - 5, h * 0.64 - fh); g.lineTo(x + fw / 2, h * 0.64 - fh - 34); g.lineTo(x + fw + 5, h * 0.64 - fh); g.fill(); g.fillStyle = 'rgba(255,190,90,0.7)'; g.fillRect(x + fw / 2 - 2, h * 0.64 - fh + 22, 4, 8); g.fillStyle = '#1a1326'; }
      hills(0.8, 44, '#15101f', 4);
    } else if (skin === 'cyber') {
      grad([[0, '#0a0418'], [0.7, '#2a0f40'], [1, '#4a1a5e']]);
      stars(60, h * 0.4, 0.5);
      glow(w * 0.5, h * 0.95, w * 0.7, 'rgba(255,60,180,0.28)');
      for (const [base, col, lit] of [[0.45, '#1a1030', 0.4], [0.62, '#120a22', 0.6]]) for (let x = 0; x < w;) { const bw = 40 + rnd() * 70, bh = h * (0.2 + rnd() * 0.35), y = h * base + h * 0.35 - bh; g.fillStyle = col; g.fillRect(x, y, bw - 4, h - y); for (let yy = y + 10; yy < h; yy += 16) for (let xx = x + 6; xx < x + bw - 10; xx += 12) if (rnd() < 0.3) { g.fillStyle = rnd() < 0.5 ? `rgba(0,240,255,${lit})` : `rgba(255,60,200,${lit})`; g.fillRect(xx, yy, 5, 7); } if (rnd() < 0.35) { const c = rnd() < 0.5 ? '#00f0ff' : '#ff2bd6'; glow(x + bw / 2, y, 40, c, 0.4); g.fillStyle = c; g.fillRect(x + 4, y - 3, bw - 12, 2); } x += bw; }
      g.strokeStyle = 'rgba(170,190,255,0.2)'; g.lineWidth = 1; for (let i = 0; i < 90; i++) { const x = rnd() * w, y = rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y + 14); g.stroke(); }
    } else if (skin === 'alien') {
      grad([[0, '#0a0316'], [1, '#200a33']]);
      stars(220, h, 0.9);
      glow(w * 0.25, h * 0.3, 300, 'rgba(125,255,176,0.18)'); glow(w * 0.7, h * 0.2, 340, 'rgba(184,107,255,0.22)'); glow(w * 0.5, h * 0.75, 280, 'rgba(90,200,255,0.12)');
      const px = w * 0.16, py = h * 0.26, pg = g.createRadialGradient(px - 22, py - 22, 6, px, py, 70); pg.addColorStop(0, '#9dffcf'); pg.addColorStop(1, '#2a6a55'); g.fillStyle = pg; g.beginPath(); g.arc(px, py, 62, 0, 7); g.fill();
      g.strokeStyle = 'rgba(200,160,255,0.6)'; g.lineWidth = 3; g.beginPath(); g.ellipse(px, py, 105, 20, -0.3, 0, 7); g.stroke();
      hills(0.86, 26, '#140a20', 7);
      for (let i = 0; i < 40; i++) glow(rnd() * w, h * (0.8 + rnd() * 0.2), 5, rnd() < 0.5 ? 'rgba(90,255,200,0.6)' : 'rgba(195,139,255,0.6)');
    } else if (skin === 'ocean') {
      grad([[0, '#0f6d99'], [0.45, '#063553'], [1, '#02101c']]);
      for (let i = 0; i < 7; i++) { const x = rnd() * w, s = 20 + rnd() * 40; const gr = g.createLinearGradient(0, 0, 0, h * 0.85); gr.addColorStop(0, 'rgba(190,240,255,0.12)'); gr.addColorStop(1, 'rgba(190,240,255,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + s, 0); g.lineTo(x + s * 3 + h * 0.25, h * 0.85); g.lineTo(x + h * 0.25, h * 0.85); g.fill(); }
      g.strokeStyle = 'rgba(210,245,255,0.35)'; g.lineWidth = 1; for (let i = 0; i < 30; i++) { g.beginPath(); g.arc(rnd() * w, rnd() * h * 0.85, 1.5 + rnd() * 3, 0, 7); g.stroke(); }
      hills(0.88, 30, '#1d3238', 2);
      for (let i = 0; i < 16; i++) { const x = rnd() * w, kh = h * (0.12 + rnd() * 0.22), y0 = h * 0.9; g.strokeStyle = rnd() < 0.5 ? '#1f6b4a' : '#2a8a5a'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y0); g.quadraticCurveTo(x + 20 * (rnd() - 0.5), y0 - kh * 0.5, x + 30 * (rnd() - 0.5), y0 - kh); g.stroke(); }
      for (let i = 0; i < 12; i++) disc(rnd() * w, h * (0.9 + rnd() * 0.08), 4 + rnd() * 7, ['#ff7a8a', '#ffb454', '#c38bff', '#ff8fb8'][i % 4]);
    } else {
      grad([[0, '#030612'], [0.6, '#070b18'], [1, '#0c1433']]);
      glow(w * 0.2, h * 0.3, w * 0.35, 'rgba(90,60,200,0.2)'); glow(w * 0.78, h * 0.55, w * 0.3, 'rgba(40,120,220,0.16)');
      stars(w * h / 3500, h);
      const px = w * 0.9, py = h * 1.05, pg = g.createRadialGradient(px - 60, py - 80, 20, px, py, h * 0.4); pg.addColorStop(0, '#2d4488'); pg.addColorStop(1, '#101a3a'); g.fillStyle = pg; g.beginPath(); g.arc(px, py, h * 0.38, 0, 7); g.fill();
      glow(px, py, h * 0.5, 'rgba(90,140,255,0.16)');
      const mx = w * 0.12, my = h * 0.18, mg = g.createRadialGradient(mx - 8, my - 8, 2, mx, my, 26); mg.addColorStop(0, '#e8ebf3'); mg.addColorStop(1, '#6a6f80'); g.fillStyle = mg; g.beginPath(); g.arc(mx, my, 24, 0, 7); g.fill();
    }
  }

  const urlSkin = (() => { try { const q = new URLSearchParams(location.search).get('skin'); return WORLD_IDS.includes(q) ? q : null; } catch { return null; } })();
  let painted = '', lastSnap = null;
  function applyWorld(s) {
    const id = urlSkin || (s && s.station && WORLD_IDS.includes(s.station.skin) ? s.station.skin : 'space');
    document.documentElement.dataset.skin = id;
    const key = id + ':' + innerWidth + 'x' + innerHeight;
    if (key !== painted) { painted = key; paintWorld($('#world'), id); }
  }
  let resizeT = 0;
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => applyWorld(lastSnap), 150); });

  function render(s) {
    const st = s.state, mode = (s.station && s.station.mode) || 'agents';
    lastSnap = s; applyWorld(s);
    $('#demo').style.display = st.demo ? 'block' : 'none';
    const live = st.posts.length;
    const net = st.earnedUsd - st.spentUsd;
    const m30 = st.moneyIn.filter((e) => within(e, 30)), d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const kids = (s.station && s.station.kids) || [];
    const kidOwed = (name) => { const k = name.toLowerCase(); return st.moneyIn.filter((e) => (e.kid || '').toLowerCase() === k).reduce((a, e) => a + e.usd, 0) - st.moneyOut.filter((e) => (e.payee || '').toLowerCase() === k).reduce((a, e) => a + e.usd, 0); };
    const topOf = (lines, key) => { const m = new Map(); for (const e of lines) { const k = key(e); if (k) m.set(k, (m.get(k) || 0) + e.usd); } return [...m.entries()].sort((a, b) => b[1] - a[1])[0]; };
    const tick = mode === 'allowance' ? [
      ['EARNED', usd(st.earnedUsd)], ['OWED', usd(kids.reduce((a, k) => a + Math.max(0, kidOwed(k.name)), 0))],
      ['PAID', usd(st.moneyOut.filter((e) => e.payee).reduce((a, e) => a + e.usd, 0))],
      ['CHORES 7D', String(count(st.moneyIn.filter((e) => within(e, 7))))],
      ['TOP KID', (() => { const t = topOf(st.moneyIn.filter((e) => within(e, 7)), (e) => e.kid); return t ? t[0] + ' ' + usd(t[1]) : 'nobody yet'; })()],
    ] : mode === 'service' ? [
      ['REV 30D', usd(m30.reduce((a, e) => a + e.usd, 0))], ['SALES 30D', String(count(m30))],
      ['AVG', count(m30) ? usd(m30.reduce((a, e) => a + e.usd, 0) / count(m30)) : 'n/a'],
      ['TODAY', usd(st.moneyIn.filter((e) => Date.parse(e.ts) >= d0.getTime()).reduce((a, e) => a + e.usd, 0))],
      ['TOP', (() => { const t = topOf(m30, (e) => e.path); const c = t && s.catalog.find((x) => x.id === t[0]); return t ? (c ? c.short || c.name : t[0]) + ' ' + usd(t[1]) : 'n/a'; })()],
      ['LEVEL', 'L' + s.level.level + (s.level.next ? ' · ' + usd(s.level.next.remainingUsd) + ' to ' + s.level.next.title : '')],
    ] : [
      ['REV', usd(st.earnedUsd)], ['SPEND', usd(st.spentUsd)], ['NET', usd(net)],
      ['YIELD', st.spentUsd > 0 ? st.yieldRatio.toFixed(2) + 'x' : 'n/a'],
      ['AGENTS', st.running.length + ' on the job'], ['LIVE', live + ' posts'],
      ['LEVEL', 'L' + s.level.level + (s.level.next ? ' · ' + usd(s.level.next.remainingUsd) + ' to ' + s.level.next.title : '')],
    ];
    const keep = urlSkin ? '?skin=' + urlSkin : '';
    $('#ticker').innerHTML = tick.map(([k, v]) => `<div>${k} <b>${esc(v)}</b></div>`).join('') + `<div><a href="/" data-keep>station</a> · <a href="/ledger" data-keep>ledger</a></div>`;
    if (keep) $('#ticker').querySelectorAll('a[data-keep]').forEach((a) => a.setAttribute('href', a.getAttribute('href') + keep));

    $('#grid').innerHTML = s.catalog.map((spec) => {
      const p = st.paths[spec.id];
      const gated = spec.gate && !(st.gates[spec.gate] && st.gates[spec.gate].cleared);
      const crew = st.running.filter((r) => r.path === spec.id);
      const status = p.status !== 'active' ? p.status : gated ? 'gated' : crew.length ? 'live' : '';
      let nextSeen = false;
      const steps = spec.stageList.map((sg, i) => {
        const n = sg.id === 'paid' ? Math.max(p.outcomes.paid, p.moneyIn.length) : p.outcomes[sg.id];
        const done = n >= sg.target;
        const next = !done && !nextSeen && p.status === 'active';
        if (next) nextSeen = true;
        const cls = done ? 'done' : next ? (gated ? 'gated' : 'next') : '';
        return `<div class="step ${cls}"><span class="n">STEP ${i + 1} · ${esc(sg.id.toUpperCase())}</span> ${done ? '✓' : ''}<br>${esc(sg.label)} <span style="float:right">${n}/${sg.target}</span><div class="bar"><i style="width:${Math.min(100, 100 * n / sg.target)}%"></i></div></div>`;
      }).join('');
      const posts = p.posts.slice().sort((a, b) => b.earnedUsd - a.earnedUsd || (a.ts < b.ts ? 1 : -1)).slice(0, 4)
        .map((x) => `<div class="card ${x.earnedUsd > 0 ? 'earned' : ''}"><div class="thumb">${esc(x.platform.toUpperCase())}${x.earnedUsd > 0 ? ' · ' + usd(x.earnedUsd) : ''}</div><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`);
      const drafts = outbox.filter((o) => o.path === spec.id).slice(0, Math.max(0, 4 - posts.length))
        .map((o) => `<div class="card"><div class="thumb">DRAFT</div>${esc(o.file)}</div>`);
      const cards = [...posts, ...drafts];
      // a service room (a barber's skin fade, a shop's retail) shows its sales instead of a sales pipeline
      const svc = spec.kind === 'service', chores = svc && mode === 'allowance';
      let sales = '', sold = '';
      if (svc) {
        const DAY = 864e5, now = Date.now(), lines = st.moneyIn.filter((e) => e.path === spec.id);
        const m30 = lines.filter((e) => now - Date.parse(e.ts) < 30 * DAY);
        const n30 = m30.reduce((a, e) => a + (e.qty || 1), 0), r30 = m30.reduce((a, e) => a + e.usd, 0);
        const d0 = new Date(); d0.setHours(0, 0, 0, 0);
        const m0 = new Date(d0.getFullYear(), d0.getMonth(), 1).getTime();
        const today = lines.filter((e) => Date.parse(e.ts) >= d0.getTime()).reduce((a, e) => a + (e.qty || 1), 0);
        const month = lines.filter((e) => Date.parse(e.ts) >= m0).reduce((a, e) => a + e.usd, 0);
        const hours = n30 * (spec.minutes || 0) / 60, profit = r30 - n30 * (spec.costUsd || 0);
        const row = (k, v) => `<div class="step done"><span class="n">${k}</span><span style="float:right">${v}</span></div>`;
        const goal = spec.goalUsd || 0, gp = goal ? Math.min(100, 100 * month / goal) : 0;
        sales = (chores
          ? row('DONE · 30 DAYS', n30) + row('EARNED · 30 DAYS', usd(r30)) + row('PAYS', usd(spec.priceUsd || 1)) + row('PAY PER HOUR', spec.minutes ? usd((spec.priceUsd || 1) * 60 / spec.minutes) + '/hr' : 'n/a') + row('DONE TODAY', today)
          : row('SOLD · 30 DAYS', n30) + row('REVENUE · 30 DAYS', usd(r30)) + row('AVG TICKET', n30 ? usd(r30 / n30) : '-') + row('PROFIT PER HOUR', hours ? usd(Math.round(profit / hours)) + '/hr' : 'n/a') + row('SOLD TODAY', today)) +
          `<div class="step ${goal && month >= goal ? 'done' : 'next'}"><span class="n">THIS MONTH</span> ${usd(month)}${goal ? ` of ${usd(goal)}` : ''}<div class="bar"><i style="width:${gp}%"></i></div></div>`;
        const items = new Map();
        // a chore chart groups by who did it; a shop by what sold
        for (const e of m30) { const k = String((chores ? e.kid : e.item) || e.tag || (chores ? 'someone' : 'sale')).trim(); const x = items.get(k) || { n: 0, usd: 0 }; x.n += e.qty || 1; x.usd += e.usd; items.set(k, x); }
        sold = [...items.entries()].sort((a, b) => b[1].usd - a[1].usd).slice(0, 5).map(([k, x]) => `<div class="card"><div class="thumb">×${x.n} · ${usd(x.usd)}</div>${esc(k)}</div>`).join('');
      }
      const events = st.tail.filter((e) => e.path === spec.id && e.kind !== 'money.out').slice(-4).reverse().map((e) => {
        const t = (e.ts || '').slice(5, 16).replace('T', ' ');
        const txt = e.kind === 'money.in' ? (e.kid ? `${e.kid} +${usd(e.usd)}${e.evidence && e.evidence !== 'checked off' ? ' · ' + e.evidence : ''}` : `+${usd(e.usd)} ${e.source}`) : e.kind === 'outcome' ? `${e.stage}: ${e.ref}` : e.kind === 'post' ? `posted ${e.platform}: ${e.title}` : e.kind === 'agent.run.start' ? `${e.role} dispatched` : e.kind === 'agent.run.end' ? `${e.role} ${e.reason} ${usd(e.usd)}` : (e.text || e.kind);
        return `<div>&gt; ${esc(t)} ${esc(txt)}</div>`;
      }).join('');
      return `<section class="term ${p.status === 'killed' ? 'killed' : ''}">
        <header><h2 class="glow">#${spec.rank} ${esc(spec.short || spec.name)} ${chores ? 'chore' : 'terminal'}</h2>${status ? `<span class="tag ${status}">${status.toUpperCase()}</span>` : ''}</header>
        <div class="kpis glow">${svc && mode !== 'agents' ? (() => {
          const lines = st.moneyIn.filter((e) => e.path === spec.id), l30 = lines.filter((e) => within(e, 30)), r = l30.reduce((a, e) => a + e.usd, 0);
          const k = (a, b) => `<div><div class="k">${a}</div><div class="v">${b}</div></div>`;
          return chores ? k('Earned', usd(p.earnedUsd)) + k('Done 30d', count(l30)) + k('Pays', usd(spec.priceUsd || 1)) + k('This week', count(lines.filter((e) => within(e, 7))))
            : k('Revenue', usd(p.earnedUsd)) + k('Sales 30d', count(l30)) + k('Avg', count(l30) ? usd(r / count(l30)) : '-') + k('Today', count(lines.filter((e) => Date.parse(e.ts) >= d0.getTime())));
        })() : `
          <div><div class="k">Revenue</div><div class="v">${usd(p.earnedUsd)}</div></div>
          <div><div class="k">Spend</div><div class="v">${usd(p.spentUsd)}</div></div>
          <div><div class="k">Crew</div><div class="v crew">${crew.length ? crew.length + '<span class="blink">_</span>' : '0'}</div></div>
          <div><div class="k">Live</div><div class="v">${p.posts.length}</div></div>`}
        </div>
        <div class="body">
          <div class="pipe"><h3>${chores ? 'Chore log' : svc ? 'Sales' : 'Pipeline'}</h3>${svc ? sales : steps}</div>
          <div class="out">${chores ? `<h3>Who did it · 30 days</h3>${sold ? `<div class="cards">${sold}</div>` : '<div class="empty">nobody has done this one in 30 days.</div>'}` : svc ? `<h3>What sold · 30 days</h3>${sold ? `<div class="cards">${sold}</div>` : '<div class="empty">nothing sold in 30 days.</div>'}` : `<h3>Output</h3>${cards.length ? `<div class="cards">${cards.join('')}</div>` : '<div class="empty">no output yet. Dispatch an agent from the station.</div>'}`}
            ${svc && mode !== 'agents' && !p.spentUsd ? '' : `<h3 style="margin-top:10px">Agent budget</h3><div class="bar" style="height:6px"><i style="width:${Math.min(100, 100 * p.spentUsd / (spec.budgetUsd || 1))}%;background:${p.spentUsd / (spec.budgetUsd || 1) > 0.8 ? 'var(--bad)' : 'var(--ph)'}"></i></div>
            <div class="empty" style="margin-top:3px">${usd(p.spentUsd)} of ${usd(spec.budgetUsd)}${spec.killTest ? ` · kill test: ${esc(spec.killTest)}` : ''}</div>`}
          </div>
        </div>
        <div class="log">${events || '<div class="empty">&gt; idle<span class="blink">_</span></div>'}</div>
      </section>`;
    }).join('');
  }

  async function poll() {
    try {
      const [s, ob] = await Promise.all([fetch('/api/state', { cache: 'no-store' }).then((r) => r.json()), fetch('/api/outbox', { cache: 'no-store' }).then((r) => r.json())]);
      outbox = ob;
      render(s);
    } catch { /* keep the last truthful frame */ }
  }
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
