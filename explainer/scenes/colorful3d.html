<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colorful 3D</title>
<style>
:root{--accent:#c6ff3d}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#fff;
  background:linear-gradient(160deg,#ff8a5c 0%,#ff4f9a 45%,#6a5cff 100%)}
#gl{position:absolute;inset:0;width:100vw;height:100vh}
.frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:7vmin;box-sizing:border-box;pointer-events:none}
.eyebrow{display:flex;justify-content:space-between;font-size:2.7vmin;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.eyebrow .n{background:#fff;color:#ff4f9a;border-radius:99px;padding:.4vmin 1.6vmin}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:5vmin}
.head{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:10vmin;line-height:1;letter-spacing:-.03em;text-shadow:0 .8vmin 0 rgba(60,0,80,.25);text-wrap:balance}
.head .w{display:inline-block}
.lines{margin-top:4vmin;display:flex;flex-wrap:wrap;gap:1.6vmin;font-size:3.6vmin;font-weight:800}
.lines .l{background:rgba(255,255,255,.18);border:.35vmin solid rgba(255,255,255,.7);border-radius:99px;padding:1.4vmin 3vmin;backdrop-filter:blur(6px)}
.cap{background:#fff;color:#2a1148;border-radius:3vmin;padding:3vmin 3.4vmin;font-size:4vmin;font-weight:800;line-height:1.3;min-height:15vmin;box-shadow:0 2vmin 5vmin rgba(60,0,80,.3)}
.cap .w{color:#c9b8d6}.cap .w.on{color:#2a1148}.cap .w.now{color:#ff4f9a}
.barwrap{margin-top:3vmin;height:1.2vmin;border-radius:1vmin;background:rgba(255,255,255,.3);overflow:hidden}
.bar{height:100%;width:0;background:#fff}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10vmin;box-sizing:border-box;background:linear-gradient(160deg,#ff8a5c,#ff4f9a 45%,#6a5cff)}
.title[hidden]{display:none}
.title h1{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:12vmin;line-height:.98;letter-spacing:-.03em;margin:0;text-shadow:0 1vmin 0 rgba(60,0,80,.25)}
.title .sub{margin-top:3vmin;font-size:3.4vmin;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
@media (min-aspect-ratio:4/3){.body{justify-content:center;padding-bottom:0;max-width:46vw}.cap{max-width:46vw}}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="frame" id="frame">
  <div class="eyebrow"><span id="brand"></span><span class="n" id="counter"></span></div>
  <div class="body"><div class="head" id="head"></div><div class="lines" id="lines"></div></div>
  <div class="cap" id="cap"></div>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</div>
<div class="title" id="title" hidden><h1 id="t1"></h1><div class="sub" id="t2"></div></div>
<script src="vendor/three.min.js"></script>
<script src="lib/icons3d.js"></script>
<script>
let R,S,C,icon,matA,matB,portrait,candy=[];
const COLORS=['#ffd23f','#4ade80','#56e0ff','#ff7ad9','#ffffff','#c6ff3d','#ff9f43'];
window.Style={
  setup(){
    portrait=innerHeight>innerWidth;
    R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,alpha:true,preserveDrawingBuffer:true});
    R.setPixelRatio(1);R.setSize(innerWidth,innerHeight);R.setClearColor(0x000000,0);R.outputColorSpace=THREE.SRGBColorSpace;
    S=new THREE.Scene();
    C=new THREE.PerspectiveCamera(portrait?45:38,innerWidth/innerHeight,.1,100);C.position.set(0,portrait?3.4:1.0,portrait?10:9);C.lookAt(0,portrait?3.4:1.0,0);
    S.add(new THREE.HemisphereLight('#ffffff','#ff4f9a',1.4));
    const key=new THREE.DirectionalLight('#ffffff',2.2);key.position.set(3,6,5);S.add(key);
    const rim=new THREE.DirectionalLight('#c6ff3d',1.5);rim.position.set(-4,2,-6);S.add(rim);
    matA=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.25,metalness:.05});
    matB=new THREE.MeshStandardMaterial({color:'#c6ff3d',roughness:.3});
    const geos=[()=>new THREE.SphereGeometry(.55,32,32),()=>new THREE.TorusGeometry(.5,.2,24,48),()=>new THREE.CapsuleGeometry(.3,.7,8,16),()=>new THREE.IcosahedronGeometry(.55,0),()=>new THREE.ConeGeometry(.45,.9,32)];
    for(let i=0;i<12;i++){ const m=new THREE.Mesh(geos[i%geos.length](),new THREE.MeshStandardMaterial({color:COLORS[i%COLORS.length],roughness:.35}));
      const a=i/12*Math.PI*2, r=portrait?3.2+(i%3)*.5:4+(i%3)*.6; m.position.set(Math.cos(a)*r,(portrait?4.6:1)+Math.sin(a*2)*(portrait?2.2:1.6),-2+Math.sin(a*3)*2); m.userData={a,i}; candy.push(m); S.add(m); }
  },
  draw(f){
    const $=id=>document.getElementById(id);
    if(f.first){ if(icon)S.remove(icon); icon=makeIcon3D(f.built.iconName,matA,matB); S.add(icon);
      $('head').innerHTML=f.built.headWords.map(w=>`<span class="w">${w}</span>`).join(' ');
      $('lines').innerHTML=f.built.lines.map(l=>`<div class="l">${l}</div>`).join(''); }
    for(const m of candy){const {a,i}=m.userData; m.position.y+=Math.sin(f.t*0.9+i)*0.004; m.rotation.x=f.t*0.4+i; m.rotation.y=f.t*0.3; }
    const s=f.thumbnail?1:H.ease(f.local/0.6)*(1+0.2*Math.sin(Math.min(f.local,0.6)/0.6*Math.PI));
    icon.scale.setScalar((portrait?0.95:1.3)*Math.max(.001,s)); icon.position.y=(portrait?4.4:1.0)+Math.sin(f.t*1.4)*0.15; icon.rotation.y=-0.4+f.local*0.6; icon.rotation.z=Math.sin(f.t)*0.08;
    R.render(S,C);
    $('frame').style.opacity=f.alpha;
    $('head').querySelectorAll('.w').forEach((el,i)=>{const p=f.headP(i);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*.6}em) rotate(${(1-p)*-6}deg)`});
    $('lines').querySelectorAll('.l').forEach((el,i)=>{const p=f.lineP(i);el.style.opacity=p;el.style.transform=`scale(${.6+.4*p})`});
    $('cap').innerHTML=f.captionHTML();
  },
  title(f){ for(const m of candy){m.rotation.x=f.t*0.4;m.rotation.y=f.t*0.3} R.render(S,C); }
};
</script>
<script src="lib/core.js"></script>
</body></html>
