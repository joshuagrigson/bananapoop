<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mannequin</title>
<style>
:root{--accent:#b9865a;--ink:#2a2622;--muted:#7a736b}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d5cd;font-family:"Inter",system-ui,sans-serif;color:var(--ink)}
#gl{position:absolute;inset:0;width:100vw;height:100vh}
.frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:7vmin;box-sizing:border-box;pointer-events:none}
.eyebrow{display:flex;justify-content:space-between;font-size:2.6vmin;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:5vmin}
.head{font-family:"Inter Display","Inter",sans-serif;font-weight:700;font-size:9vmin;line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.head .w{display:inline-block}
.lines{margin-top:4vmin;display:flex;flex-direction:column;gap:2vmin;font-size:3.8vmin;font-weight:500;line-height:1.3;max-width:70vmin}
.lines .l{display:flex;gap:2.2vmin;align-items:flex-start}
.lines .l::before{content:"";flex:none;margin-top:1.6vmin;width:3.2vmin;height:.5vmin;background:var(--accent)}
.cap{background:#f6f3ee;border-radius:1vmin;padding:3vmin 3.4vmin;font-size:4vmin;font-weight:600;line-height:1.3;min-height:15vmin;box-shadow:0 1.5vmin 4vmin rgba(40,30,20,.18)}
.cap .w{color:#b8b1a8}.cap .w.on{color:var(--ink)}.cap .w.now{color:var(--accent)}
.barwrap{margin-top:3vmin;height:.8vmin;background:rgba(0,0,0,.1);overflow:hidden}
.bar{height:100%;width:0;background:var(--accent)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10vmin;box-sizing:border-box;background:#d9d5cd}
.title[hidden]{display:none}
.title h1{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:11vmin;line-height:1;letter-spacing:-.03em;margin:0}
.title .sub{margin-top:3vmin;font-size:3.2vmin;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
@media (min-aspect-ratio:4/3){.body{justify-content:center;padding-bottom:0;max-width:46vw}.cap{max-width:46vw}}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="frame" id="frame">
  <div class="eyebrow"><span id="brand"></span><span id="counter"></span></div>
  <div class="body"><div class="head" id="head"></div><div class="lines" id="lines"></div></div>
  <div class="cap" id="cap"></div>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</div>
<div class="title" id="title" hidden><h1 id="t1"></h1><div class="sub" id="t2"></div></div>
<script src="vendor/three.min.js"></script>
<script>
let R,S,C,portrait,man,J={};
const WOOD=()=>new THREE.MeshStandardMaterial({color:'#c08f5e',roughness:.55,metalness:0});
const JOINT=()=>new THREE.MeshStandardMaterial({color:'#8a6239',roughness:.6});
function mesh(g,m,x=0,y=0,z=0){const me=new THREE.Mesh(g,m);me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;return me}
function limb(len,r,name){ // pivot group at the joint, limb hangs down -y
  const g=new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(r*1.15,20,20),JOINT())); const seg=mesh(new THREE.CapsuleGeometry(r,len-2*r,8,16),WOOD(),0,-len/2,0); g.add(seg); J[name]=g; return g; }
function buildMan(){
  man=new THREE.Group();
  man.add(mesh(new THREE.SphereGeometry(.42,32,32),WOOD(),0,3.05,0));             // head
  man.add(mesh(new THREE.CylinderGeometry(.12,.14,.3,16),WOOD(),0,2.62,0));        // neck
  const torso=mesh(new THREE.CapsuleGeometry(.5,.9,8,24),WOOD(),0,2.05,0); torso.scale.set(1,1,.7); man.add(torso);
  man.add(mesh(new THREE.SphereGeometry(.22,20,20),JOINT(),0,1.45,0));              // waist
  const pelvis=mesh(new THREE.CapsuleGeometry(.42,.3,8,24),WOOD(),0,1.15,0); pelvis.scale.set(1,1,.7); man.add(pelvis);
  for(const s of [-1,1]){
    const sh=limb(.8,.13,(s<0?'l':'r')+'Sh'); sh.position.set(s*.66,2.5,0); man.add(sh);
    const el=limb(.75,.11,(s<0?'l':'r')+'El'); el.position.set(0,-.8,0); sh.add(el);
    const hand=mesh(new THREE.SphereGeometry(.13,16,16),WOOD(),0,-.8,0); el.add(hand);
    const hip=limb(1.0,.16,(s<0?'l':'r')+'Hip'); hip.position.set(s*.26,.95,0); man.add(hip);
    const kn=limb(.95,.14,(s<0?'l':'r')+'Kn'); kn.position.set(0,-1.0,0); hip.add(kn);
    const foot=mesh(new THREE.BoxGeometry(.22,.12,.5),WOOD(),0,-.98,.12); kn.add(foot);
  }
  man.position.y=1.05; // feet on the floor
  return man;
}
// poses: rotation targets per joint {x,z} in radians. x<0 raises the arm forward, z rotates sideways.
// limbs hang down -y from their joint; rotation.x < 0 swings the limb forward, rotation.z > 0 swings the hand toward +x (the figure's right side)
const REST={lSh:{x:0,z:-.14},rSh:{x:0,z:.14},lEl:{x:-.25,z:0},rEl:{x:-.25,z:0},lHip:{x:0,z:-.04},rHip:{x:0,z:.04},lKn:{x:.05,z:0},rKn:{x:.05,z:0},head:0};
const POSES=[
  {rSh:{x:-1.5,z:.7},rEl:{x:-.3,z:0},lSh:{x:.15,z:-.2},head:.2},                 // pointing out to the right
  {rSh:{x:-.6,z:.5},rEl:{x:-2.5,z:-.35},lSh:{x:0,z:-.4},lEl:{x:-.3,z:0},head:-.2},  // phone to ear
  {rSh:{x:-.8,z:1.3},lSh:{x:-.8,z:-1.3},rEl:{x:-.3,z:0},lEl:{x:-.3,z:0},head:.1},   // arms open, welcome
  {rSh:{x:-2.9,z:.3},rEl:{x:-.1,z:0},lSh:{x:.1,z:-.4},head:.1},                   // one arm straight up
  {rSh:{x:-.3,z:1.0},lSh:{x:-.3,z:-1.0},rEl:{x:-.6,z:-1.7},lEl:{x:-.6,z:1.7},head:0}, // hands on hips
  {rSh:{x:-1.1,z:.2},rEl:{x:-1.9,z:-.4},lSh:{x:0,z:-.3},head:-.25},               // thinking
];
function applyPose(p,k,t){
  for(const n of ['lSh','rSh','lEl','rEl','lHip','rHip','lKn','rKn']){ const a=REST[n], b=p[n]||REST[n]; const j=J[n]; j.rotation.x=a.x+(b.x-a.x)*k; j.rotation.z=a.z+(b.z-a.z)*k; }
  const head=(p.head||0)*k; man.children[0].rotation.z=head*.5; man.children[0].rotation.y=head;
  man.rotation.y=-.35+Math.sin(t*.5)*.05; man.position.y=1.05+Math.sin(t*1.2)*.02;
  J.lSh.rotation.x+=Math.sin(t*1.3)*.03; J.rSh.rotation.x+=Math.sin(t*1.3+1)*.03;
}
window.Style={
  setup(){
    portrait=innerHeight>innerWidth;
    R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
    R.setPixelRatio(1);R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;
    S=new THREE.Scene();S.background=new THREE.Color('#d9d5cd');S.fog=new THREE.Fog('#d9d5cd',16,34);
    C=new THREE.PerspectiveCamera(portrait?44:34,innerWidth/innerHeight,.1,100);C.position.set(0,portrait?4.8:2.4,portrait?13.5:9.5);C.lookAt(0,portrait?4.5:2.0,0);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:'#cfcac0',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
    const key=new THREE.DirectionalLight('#fff4e6',2.4);key.position.set(5,9,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=5;Object.assign(key.shadow.camera,{left:-8,right:8,top:10,bottom:-4});S.add(key);
    const fill=new THREE.DirectionalLight('#dbe6ff',.8);fill.position.set(-6,4,3);S.add(fill);
    S.add(new THREE.HemisphereLight('#ffffff','#9c8f7c',.8));
    S.add(buildMan()); if(portrait) man.position.x=0; else man.position.x=2.6;
    if(portrait) man.position.y=1.05+3.0; // lift into the top half of a tall frame
    man.userData.base=man.position.y;
  },
  draw(f){
    const $=id=>document.getElementById(id);
    if(f.first){ $('head').innerHTML=f.built.headWords.map(w=>`<span class="w">${w}</span>`).join(' '); $('lines').innerHTML=f.built.lines.map(l=>`<div class="l">${l}</div>`).join(''); }
    const k=f.thumbnail?1:H.ease(f.local/1.1);
    applyPose(POSES[f.b.index%POSES.length],k,f.t); man.position.y=man.userData.base+Math.sin(f.t*1.2)*.02;
    R.render(S,C);
    $('frame').style.opacity=f.alpha;
    $('head').querySelectorAll('.w').forEach((el,i)=>{const p=f.headP(i);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*.5}em)`});
    $('lines').querySelectorAll('.l').forEach((el,i)=>{const p=f.lineP(i);el.style.opacity=p;el.style.transform=`translateX(${(1-p)*3}vmin)`});
    $('cap').innerHTML=f.captionHTML();
  },
  title(f){ applyPose(REST,0,f.t); R.render(S,C); }
};
</script>
<script src="lib/core.js"></script>
</body></html>
