<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Studio 3D</title>
<style>
:root{--accent:#e8703f;--ink:#17191b;--muted:#6b7075;--card:#ffffff}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e6;font-family:"Inter",system-ui,sans-serif;color:var(--ink)}
#gl{position:absolute;inset:0;width:100vw;height:100vh}
.frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:7vmin;box-sizing:border-box;pointer-events:none}
.eyebrow{display:flex;justify-content:space-between;font-size:2.6vmin;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow .n{color:var(--accent);font-variant-numeric:tabular-nums}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:5vmin}
.head{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:9.4vmin;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.head .w{display:inline-block}
.lines{margin-top:4vmin;display:flex;flex-direction:column;gap:2vmin;font-size:3.9vmin;font-weight:500;line-height:1.3;max-width:70vmin}
.lines .l{display:flex;gap:2.2vmin;align-items:flex-start}
.lines .l::before{content:"";flex:none;margin-top:1.4vmin;width:2vmin;height:2vmin;border-radius:50%;background:var(--accent)}
.cap{background:var(--card);border-radius:2vmin;padding:3vmin 3.4vmin;font-size:4vmin;font-weight:600;line-height:1.3;min-height:15vmin;box-shadow:0 2vmin 5vmin rgba(0,0,0,.12)}
.cap .w{color:#b0b4b8}.cap .w.on{color:var(--ink)}.cap .w.now{color:var(--accent)}
.barwrap{margin-top:3vmin;height:.9vmin;border-radius:1vmin;background:rgba(0,0,0,.08);overflow:hidden}
.bar{height:100%;width:0;background:var(--accent)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10vmin;box-sizing:border-box;background:#e9e9e6}
.title[hidden]{display:none}
.title h1{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:11vmin;line-height:1;letter-spacing:-.03em;margin:0}
.title .sub{margin-top:3vmin;font-size:3.2vmin;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
@media (min-aspect-ratio:4/3){.body{justify-content:center;padding-bottom:0;max-width:46vw}.cap{max-width:46vw}}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="frame" id="frame">
  <div class="eyebrow"><span id="brand"></span><span class="n" id="counter"></span></div>
  <div class="body"><div class="head" id="head"></div><div class="lines" id="lines"></div></div>
  <div class="cap" id="cap"></div>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</div>
<div class="title" id="title" hidden><h1 id="t1"></h1><div class="sub" id="t2"></div></div>
<script src="vendor/three.min.js"></script>
<script src="lib/icons3d.js"></script>
<script>
let R,S,C,icon,matA,matB,portrait;
window.Style={
  setup(D){
    portrait=innerHeight>innerWidth;
    R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
    R.setPixelRatio(1);R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
    R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;
    S=new THREE.Scene();S.background=new THREE.Color('#e9e9e6');S.fog=new THREE.Fog('#e9e9e6',14,30);
    C=new THREE.PerspectiveCamera(portrait?42:36,innerWidth/innerHeight,.1,100);
    C.position.set(0,portrait?4.2:2.2,portrait?10:8.5);C.lookAt(0,portrait?3.4:1.2,0);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:'#e2e2de',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
    const key=new THREE.DirectionalLight('#ffffff',2.6);key.position.set(4,8,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=6;key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;S.add(key);
    const fill=new THREE.DirectionalLight('#dfe8ff',1.0);fill.position.set(-6,3,2);S.add(fill);
    const rim=new THREE.DirectionalLight('#ffffff',1.2);rim.position.set(0,5,-8);S.add(rim);
    S.add(new THREE.HemisphereLight('#ffffff','#b8b8b0',.9));
    matA=new THREE.MeshPhysicalMaterial({color:D.accent||'#e8703f',roughness:.32,metalness:0,clearcoat:1,clearcoatRoughness:.15});
    matB=new THREE.MeshPhysicalMaterial({color:'#f5efe3',roughness:.4,clearcoat:.6});
    // a soft rounded plinth the icon floats over
    const plinth=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,.25,64),new THREE.MeshStandardMaterial({color:'#f4f4f1',roughness:.9}));plinth.position.y=portrait?2.6:.12;plinth.receiveShadow=true;plinth.castShadow=true;S.add(plinth);
  },
  draw(f){
    const $=id=>document.getElementById(id);
    if(f.first){ if(icon)S.remove(icon); icon=makeIcon3D(f.built.iconName,matA,matB); icon.scale.setScalar(1.35); S.add(icon);
      $('head').innerHTML=f.built.headWords.map(w=>`<span class="w">${w}</span>`).join(' ');
      $('lines').innerHTML=f.built.lines.map(l=>`<div class="l">${l}</div>`).join(''); }
    const pop=f.thumbnail?1:Math.min(1,1.7*f.iconP-0.7*f.iconP*f.iconP); // slight overshoot
    icon.scale.setScalar((portrait?0.8:1.1)*Math.max(0.001,f.thumbnail?1:(H.ease(f.local/0.6)*(1+0.15*Math.sin(Math.min(f.local,0.6)/0.6*Math.PI)))));
    icon.position.y=(portrait?4.2:1.7)+Math.sin(f.t*1.3)*0.12;
    icon.rotation.y=-0.5+f.local*0.45; icon.rotation.x=-0.1+Math.sin(f.t*0.9)*0.05;
    R.render(S,C);
    $('frame').style.opacity=f.alpha;
    $('head').querySelectorAll('.w').forEach((el,i)=>{const p=f.headP(i);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*.6}em)`});
    $('lines').querySelectorAll('.l').forEach((el,i)=>{const p=f.lineP(i);el.style.opacity=p;el.style.transform=`translateX(${(1-p)*3}vmin)`});
    $('cap').innerHTML=f.captionHTML();
  },
  title(){ R.render(S,C); }
};
</script>
<script src="lib/core.js"></script>
</body></html>
