<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <title>NEXUS — Smoky Silver Remote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="remotes" aria-label="TV remote"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog"><header><h2 id="dialog-title"></h2><button class="close" aria-label="Close dialog">×</button></header></form>
    <div id="dialog-body"></div>
  </dialog>
  <script src="gesture-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
